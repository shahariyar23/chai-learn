
name: CD

# Deploy only after CI succeeds on main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Deploy only when CI has passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.5

        env:
          # Deploy the exact commit validated by CI.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA

          script: |
            set -euo pipefail

            # ----------------------------------------
            # 1. Configure Node.js, pnpm and PM2 PATH
            # ----------------------------------------

            export HOME="/home/mostak"

            export PATH="/home/mostak/.nvm/versions/node/v26.13.0/bin:/home/mostak/.local/share/pnpm/bin:$PATH"

            echo "Checking deployment environment..."

            node -v
            pnpm -v
            pm2 -v

            command -v node
            command -v pnpm
            command -v pm2

            # ----------------------------------------
            # 2. Navigate to project directory
            # ----------------------------------------

            cd /opt/chai-learn

            echo "Fetching latest repository information..."

            git fetch --quiet origin main

            echo "Deploying commit: $DEPLOY_SHA"

            git reset --hard "$DEPLOY_SHA"

            # ----------------------------------------
            # 3. Backend dependencies and migration
            # ----------------------------------------

            echo "Installing backend dependencies..."

            pnpm --dir backend install --frozen-lockfile

            echo "Running production database migrations..."

            NODE_ENV=production pnpm --dir backend run db:migrate:prod

            # ----------------------------------------
            # 4. Frontend dependencies and build
            # ----------------------------------------

            echo "Installing frontend dependencies..."

            pnpm --dir frontend install --frozen-lockfile

            echo "Building frontend..."

            pnpm --dir frontend run build

            # ----------------------------------------
            # 5. Reload PM2 applications
            # ----------------------------------------

            echo "Reloading backend..."

            pm2 reload backend

            echo "Reloading frontend..."

            pm2 reload frontend

            # ----------------------------------------
            # 6. Backend health check
            # ----------------------------------------

            echo "Checking backend health..."

            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
                echo "Backend health check passed."
                break
              fi

              echo "Waiting for backend... ($i/10)"
              sleep 3

              if [ "$i" -eq 10 ]; then
                echo "ERROR: Backend health check failed."
                pm2 list
                pm2 logs backend --lines 50 --nostream
                exit 1
              fi
            done

            # ----------------------------------------
            # 7. Frontend health check
            # ----------------------------------------

            echo "Checking frontend..."

            if ! curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              echo "ERROR: Frontend health check failed."
              pm2 list
              pm2 logs frontend --lines 50 --nostream
              exit 1
            fi

            echo "Frontend health check passed."

            # ----------------------------------------
            # 8. Save PM2 process list
            # ----------------------------------------

            pm2 save

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "Commit: $DEPLOY_SHA"
            echo "======================================"
